<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AI Chatbot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 90%;
            max-width: 800px;
        }
        h1 {
            color: #4A90E2;
        }
        /* Styles the box that holds your Landbot */
        #chatbot-container {
            margin-top: 20px;
            height: 550px; /* Adjust height if needed */
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Welcome to My AI Assistant</h1>
        <p>Feel free to interact with the chatbot below!</p>
        
        <!-- Embedded Landbot -->
        <div id="chatbot-container">
            <iframe src="https://landbot.site/v3/H-3516152-BCEHEDSUDWHQX0U9/index.html" allow="microphone; camera"></iframe>
        </div>
    </div>

</body>
</html>
